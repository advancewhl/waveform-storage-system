[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "site-user-waveform-storage"
version = "0.1.0"
description = "Offline-compatible core modules for SHINE waveform storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
mongodb = ["pymongo>=4"]
spectrum = ["pandas>=2.0", "scipy>=1.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"waveform_storage.analysis.pv_engine" = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "src/waveform_storage/legacy",
    "apps/operator_gui/mainWindow.py",
]

[tool.mypy]
python_version = "3.10"
packages = ["waveform_storage"]
exclude = "waveform_storage/legacy"
ignore_missing_imports = true

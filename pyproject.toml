[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "site-user-waveform-storage"
version = "0.1.0"
description = "Offline-compatible core modules for SHINE waveform storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.8",
    "numpy>=1.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
